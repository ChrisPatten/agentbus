  E30:
    status: complete
    completed: 2026-08-19
    notes: >
      Decoupled memory-logging agent. Discovered mid-implementation that
      E20's journaling-on-pause dispatcher (SessionTracker.dispatchJournaling)
      already provided most of the "separate debounced sweep" mechanism the
      epic called for, so S30.2 extends it rather than building a parallel
      system: added a hard ceiling (journaling.ceiling_ms) so a
      continuously-active conversation still flushes periodically (the
      pre-existing idle-only trigger never tripped for those), and
      in-flight suppression so a slow sweep can't accumulate a queued
      backlog of redundant retriggers. S30.1/S30.3 are prompt-template/doc
      guidance (system_prompt should stop instructing post-reply journaling,
      with a documented high-stakes inline exception) rather than adapter
      code changes — there was no hardcoded post-reply instruction in
      agentbus itself to remove. S30.4 decouples
      HeadlessInstance.enqueue()'s per-contact queue from full process exit:
      it now advances at the moment a turn calls reply/send_message
      (onDelivered callback threaded through invokeClaude/runClaudeTurn),
      with claude_session_id now persisted as soon as it's first seen in the
      stream (not just at turn end) to close a rapid-fire-second-message
      race the early-advance would otherwise open on a brand-new
      conversation. Implemented on feat/e30-decoupled-memory-logging, not
      yet merged to dev as of this entry. See
      docs/CC_HEADLESS_ADAPTER.md#memory-logging-e30.
    stories:
      S30.1: complete  # Strip post-reply memory-logging out of the main turn (docs/prompt-template guidance)
      S30.2: complete  # Debounced memory-sweep scheduler (extended E20's dispatcher: hard ceiling + overlap suppression)
      S30.3: complete  # High-stakes immediate-logging exception (documented policy + system_prompt template)
      S30.4: complete  # Queue responsiveness: advance on reply, not on full turn completion
      S30.5: complete  # Docs, tests, wiring
  E31:
    status: complete
    completed: 2026-08-31
    notes: >
      Outbound transcript logging. transcripts previously only ever received
      direction:'inbound' rows outside a narrow slash-command special case
      (src/http/api.ts) — the actual delivery chokepoint for reply,
      send_message, send_email, and scheduled-message delivery
      (DeliveryWorker.deliver(), src/core/delivery.ts) never wrote a
      transcripts row at all, so search_transcripts could never confirm what
      an agent's own outbound reply actually said/used. Shared
      logOutboundTranscript() helper (src/pipeline/outbound-transcript.ts)
      extracted from the pre-existing slash-command insert; DeliveryWorker
      now calls it after a confirmed adapter.send() success, resolving
      conversation_id/session_id via conversation_registry the same way the
      inbound pipeline does (falls back to null when unresolvable rather than
      failing the send); a failed/dead-lettered send writes zero rows;
      logging failures are caught/logged, never allowed to affect
      delivery/ack/retry. Origin: two production debugging incidents
      (2026-08-19 send_message topic-param bug, 2026-08-20 scheduled-wakeup
      channel-routing question) where outbound content was unverifiable.
    stories:
      S31.1: complete  # Shared outbound-transcript-insert helper (src/pipeline/outbound-transcript.ts)
