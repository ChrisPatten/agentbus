      S15.3: pending  # E9 context injection excludes temp sessions from context window
      S15.4: pending  # /end command (or idle timeout) to explicitly close temp session
  E16:
    status: backlog
    notes: >
      Link AgentBus sessions to native Claude Code sessions. When the CC adapter
      receives a message, capture the active Claude Code session ID (e.g. from
      MCP context or a handshake tool call) and store it in sessions.cc_session_id.
      Enables cross-referencing: given a bus session you can find the CC session
      that handled it, and vice versa. Unlocks future features like session
      continuity (resume a bus conversation in the same CC session), transcript
      merging, and per-session tool-call attribution.
    stories:
      S16.1: pending  # Add cc_session_id column to sessions table (migration)
      S16.2: pending  # CC adapter reports its session ID via a new MCP tool or handshake
      S16.3: pending  # bus-core stores cc_session_id when session is created/updated
      S16.4: pending  # Expose cc_session_id in /sessions output and get_session MCP tool
  E17:
    status: complete
    completed: 2026-04-21
    notes: >
      Inbound image handling. Telegram adapter detects photo/document (image/*)
      updates, resolves the target agent via pipeline.routes, calls getFile +
      downloads to <download_path>/<uuid><ext>, inserts a row into attachments
      (id, agent_id, local_path, original_filename, mime_type, created_at,
      expires_at; Unix ms), and attaches the file to InboundMessage.attachments.
      processInbound copies attachments into envelope.metadata.attachments so
      the data survives enqueue/dequeue. CC adapter's formatMessagesForSampling
      appends [Image: <path>] lines after the body. AttachmentSweeper runs on
      startup and every 10 minutes (hardcoded), unlinking expired files and
      deleting rows; ENOENT tolerated, one bad row does not abort the sweep.
      Empty-caption messages pass the processInbound guard when attachments
      are present. Outbound and non-image attachments remain out of scope.
    stories:
      S17.1: complete  # Config schema + startup mkdir (src/config/schema.ts, src/index.ts)
      S17.2: complete  # Migration 006_attachments.sql (+ registration in src/db/schema.ts)
      S17.3: complete  # Telegram adapter detect/download + InboundMessage.attachments + processInbound
      S17.4: complete  # CC adapter formatMessagesForSampling appends [Image: ...] lines
      S17.5: complete  # AttachmentSweeper (src/media/attachment-sweeper.ts) + index.ts lifecycle
      S17.6: complete  # docs/ATTACHMENTS.md + config.yaml.example + TELEGRAM_ADAPTER.md pointer
  E19:
    status: complete
    completed: 2026-05-26
    notes: >
      Headless Claude Code adapter. In-process adapter (cc-headless.ts) that
      polls the bus HTTP API, serializes per-contact via promise chaining,
      spawns `claude -p --output-format stream-json` per message batch, and
      POSTs the result text as an outbound envelope. Session continuity via
      --resume <claude_session_id> stored in sessions.claude_session_id
      (migration 008). AGENTBUS_TOOLS_ONLY=true mode added to cc.ts so it
      can serve as the MCP subprocess without starting the polling loop.
      System prompt uses {{variable}} template interpolation via
      prompt-renderer.ts; memories and last session summary injected directly
      into the system prompt (replaces E9 envelope metadata injection for this
      path). registerHeadlessTools() excludes reply/send_message/get_adapter_status.
      Adapter auto-starts from index.ts when cc-headless config block is present.
    stories:
      S19.1: complete  # Migration 008 — ADD COLUMN claude_session_id TEXT to sessions
      S19.2: complete  # AGENTBUS_TOOLS_ONLY mode in cc.ts + registerHeadlessTools()
      S19.3: complete  # Config schema — CcHeadlessAdapterSchema in schema.ts
      S19.4: complete  # System prompt renderer (src/adapters/prompt-renderer.ts)
      S19.5: complete  # cc-headless.ts + index.ts wiring
      S19.6: complete  # CC_ADAPTER.md pointer to CC_HEADLESS_ADAPTER.md
  E19.1:
    status: complete
    completed: 2026-06-16
    notes: >
      Headless adapter refinements. (1) Reply control: registerHeadlessTools now
      exposes reply + send_message (registerReplyTool split out of
      registerCoreTools so headless gets reply without get_adapter_status); the
      adapter watches stream-json assistant turns for mcp__agentbus__reply /
      send_message tool_use and lets the agent own delivery (interim updates +
      final answer), falling back to stdout result text only when no delivery
      tool was called. (2) Double memory fix: formatMessagesForSampling takes
      includeMemoryContext; cc-headless passes false so the Stage-85 <memory>
      block is not also prepended to the user message. (3) Typing indicator:
      POST /api/v1/adapters/:channel/typing at batch start. (4) Silent-failure
      fix: error_reply config delivered to the user on spawn/parse failure when
      nothing was delivered via tool. (5) Context loading: working_dir config
      sets claude -p cwd so the agent's CLAUDE.md (+ @imports) auto-loads;
      expandFileReferences adds @path inclusion to the system_prompt template
      (operator-controlled only). Cross-contact isolation documented as an
      accepted tradeoff (not fixed).
    stories:
      S19.1.1: complete  # Split registerReplyTool; reply+send_message in headless set
      S19.1.2: complete  # formatMessagesForSampling includeMemoryContext opt-out
      S19.1.3: complete  # stream-json tool-delivery detection + stdout fallback
      S19.1.4: complete  # Typing indicator POST on batch start
      S19.1.5: complete  # error_reply config + failure delivery
      S19.1.6: complete  # working_dir cwd + @path expansion (prompt-renderer)
      S19.1.7: complete  # Tests (cc.test, prompt-renderer.test) + docs update
  E20:
    status: complete
    completed: 2026-06-18
    notes: >
      Journaling memory model & long-lived sessions. The agent's own files
      (MEMORY.md + daily journal) are the source of truth; the bus orchestrates
      rather than stores. (1) Long-lived headless sessions: idle no longer tears
      them down (transcript-log Stage 80 + SessionTracker.closeIdleSessions guard
      on claude_session_id IS NOT NULL), resume keyed on conversation_id
