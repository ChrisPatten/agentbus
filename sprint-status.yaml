      MEMORY.md + journal_lookback_days of daily files into {{memories}} every
      turn, replacing the DB memory/summary injection; {{session_summary}} now
      empty. (3) Journaling on pause: SessionTracker.dispatchJournaling fires the
      adapter's runJournalingTurn (silent, no-deliver, no typing) for sessions
      idle past per-channel journaling.threshold_ms and not journaled since last
      activity; migration 009 adds sessions.last_journaled_at; in-memory attempt
      cap, re-armed by new activity. Wired via startHeadless handle +
      sessionTracker.setJournalingRunner in index.ts. (4) Structured extraction
