  E29:
    status: complete
    completed: 2026-08-18
    notes: >
      Live tool-call status stream — non-delivery tool calls during a
      headless turn appear as batched lines in a single evolving Telegram
      message (editMessageText), overwritten by the final answer on
      delivery. Also shipped in the same branch: /stop slash command
      (hard-kills the in-flight claude -p child with SIGKILL, since SIGTERM
