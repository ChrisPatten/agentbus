      functional reply_to (native quote, suppressed when replying to the
      already-latest message). Also fixed post-implementation during live
      testing: pipeline.routes/relays exact-channel-equality bug
      (channelMatches(), so existing config matches a bot's groups with no
      changes) and send_message's missing topic param (was hard-coded to
      "general", so a create_telegram_topic-returned thread could never be
      targeted). Implemented on feat/e27-e28-thread-store, not yet merged to
      dev/main as of this entry. See
      docs/TELEGRAM_ADAPTER.md#group-topics--replies-e28.
    stories:
      S28.1: complete  # Group channel identity: auto-routing, no per-group config
      S28.2: complete  # Forum topics on the generic thread store (group-scoped)
      S28.3: complete  # Outbound: reply into the correct chat and topic
      S28.4: complete  # Agent-originated topics: create_telegram_topic tool (group-only)
