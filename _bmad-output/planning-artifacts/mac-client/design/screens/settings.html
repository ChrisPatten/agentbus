<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mac · Settings, Connection</title>
<!-- AgentBus Mac client mockup, 640x560. Visual reference only: see ../DESIGN.md. Hex colors stand in for system colors. -->
<style>
body{margin:0}
a{color:#0063D1}a:hover{color:#004A9E}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 0.9s linear infinite}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid rgba(0,99,209,0.5);outline-offset:1px}
</style>
<style>html{background:#D9D9DE}body{padding:40px;display:flex;justify-content:center}</style>
</head>
<body>
<div style="width: 640px; height: 560px; box-sizing: border-box; border-radius: 16px; overflow: hidden; background: #F5F5F7; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; font-size: 13px; display: flex; flex-direction: column">
<div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 14px 8px; border-bottom: 0.5px solid rgba(0,0,0,0.09); background: #FFFFFF">
<div style="position: absolute; left: 14px; top: 14px"><div aria-hidden="true" style="display: flex; gap: 8px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span></div></div>
<h1 style="margin: 0; font-size: 13px; font-weight: 600">Connection</h1>
<div role="toolbar" aria-label="Settings sections" style="display: flex; gap: 4px"><button type="button" aria-pressed="false" style="width: 76px; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; border-radius: 10px; background: transparent; color: #6E6E73; font: inherit; font-size: 11px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3.5v2.5M12 18v2.5M3.5 12H6M18 12h2.5M6 6l1.8 1.8M16.2 16.2L18 18M6 18l1.8-1.8M16.2 7.8L18 6"></path></svg><span style="color: #6E6E73">General</span></button><button type="button" aria-pressed="true" style="width: 76px; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; border-radius: 10px; background: rgba(0,0,0,0.07); color: #0066D6; font: inherit; font-size: 11px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14l4-4M8.5 11.5l-2 2a3 3 0 0 0 4 4l2-2M15.5 12.5l2-2a3 3 0 0 0-4-4l-2 2"></path></svg><span style="color: #1D1D1F">Connection</span></button><button type="button" aria-pressed="false" style="width: 76px; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; border-radius: 10px; background: transparent; color: #6E6E73; font: inherit; font-size: 11px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 16v-5a5.5 5.5 0 0 1 11 0v5l1.5 2h-14z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span style="color: #6E6E73">Notifications</span></button></div>
</div>
<form style="flex-grow: 1; padding: 20px 28px; display: flex; flex-direction: column; gap: 18px; overflow: auto">
<div style="border-radius: 10px; background: rgba(0,0,0,0.045); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.09)"><div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 38px; padding: 4px 12px; border-bottom: 0.5px solid rgba(0,0,0,0.09);"><label for="u" style="font-size: 13px">Bus URL</label><input id="u" type="text" value="http://127.0.0.1:3000" style="width: 280px; height: 24px; padding: 0 8px; border-radius: 6px; border: 0; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.18); background: #FFFFFF; font: inherit; font-size: 13px; text-align: right; color: #1D1D1F"></div><div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 38px; padding: 4px 12px; border-bottom: 0.5px solid rgba(0,0,0,0.09);"><label for="k" style="font-size: 13px">App token</label><input id="k" type="password" value="••••••••••••••••••••••" style="width: 280px; height: 24px; padding: 0 8px; border-radius: 6px; border: 0; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.18); background: #FFFFFF; font: inherit; font-size: 13px; text-align: right; color: #1D1D1F"></div><div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 38px; padding: 4px 12px; "><label for="bt" style="font-size: 13px">Bus token</label><input id="bt" type="password" placeholder="Optional" style="width: 280px; height: 24px; padding: 0 8px; border-radius: 6px; border: 0; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.18); background: #FFFFFF; font: inherit; font-size: 13px; text-align: right; color: #1D1D1F"></div></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px; font-size: 11px; color: #6E6E73">Tokens are stored in your login keychain.</div>
<div style="border-radius: 10px; background: rgba(0,0,0,0.045); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.09)"><div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 38px; padding: 4px 12px; border-bottom: 0.5px solid rgba(0,0,0,0.09);"><span style="display: flex; align-items: center; gap: 8px"><span style="display: inline-flex; color: #1F8A3B"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.5l4 4 9-9"></path></svg></span>Connected as chris</span><button type="button" style="height: 24px; padding: 0 12px; border-radius: 6px; border: 0; background: #FFFFFF; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.18), 0 1px 1px rgba(0,0,0,0.05); font: inherit; font-size: 13px; color: #1D1D1F">Test Connection</button></div><div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 38px; padding: 4px 12px; border-bottom: 0.5px solid rgba(0,0,0,0.09);"><span style="color: #6E6E73">Agent</span><span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px">agent:work via cc-headless</span></div><div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 38px; padding: 4px 12px; border-bottom: 0.5px solid rgba(0,0,0,0.09);"><span style="color: #6E6E73">Agent slots</span><span>5 total, 1 reserved for scheduled work</span></div><div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 38px; padding: 4px 12px; border-bottom: 0.5px solid rgba(0,0,0,0.09);"><span style="color: #6E6E73">Upload limit</span><span>25 MB</span></div><div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 38px; padding: 4px 12px; "><span style="color: #6E6E73">Bus version</span><span>[x.y.z]</span></div></div>
<div style="border-radius: 10px; background: rgba(0,0,0,0.045); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.09)"><div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 38px; padding: 4px 12px; "><label for="lg" style="font-size: 13px">Open at login</label><span style="position: relative; display: inline-flex"><input id="lg" type="checkbox" checked="" style="position: absolute; opacity: 0; width: 38px; height: 22px; margin: 0"><span aria-hidden="true" style="width: 38px; height: 22px; border-radius: 11px; background: #0063D1; display: inline-flex; align-items: center; justify-content: flex-end; padding: 2px; box-sizing: border-box"><span style="width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.25)"></span></span></span></div></div>
</form>
</div>
</body>
</html>
