name: AgentBus
options:
  bundleIdPrefix: com.chrispatten
  deploymentTarget:
    macOS: "26.5"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.5"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  AgentBus:
    type: application
    platform: macOS
    sources:
      - path: AgentBus
    info:
      path: AgentBus/Info.plist
      properties:
        CFBundleDisplayName: AgentBus
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrispatten.agentbus.mac
        GENERATE_INFOPLIST_FILE: YES
  AgentBusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AgentBusTests
    dependencies:
      - target: AgentBus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrispatten.agentbus.mac.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AgentBus:
    build:
      targets:
        AgentBus: all
        AgentBusTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentBusTests
