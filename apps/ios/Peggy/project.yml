# Peggy (iOS) — XcodeGen spec. `xcodegen generate` writes Peggy.xcodeproj (git-ignored).
# export DEVELOPMENT_TEAM=XXXXXXXXXX before generating to sign for a device; never commit a team id.
name: Peggy
options:
  bundleIdPrefix: com.chrispatten
  # The build Mac has Xcode 26.0.1 / the iOS 26.0 SDK today. Everything the POC
  # uses (IntentModes, supportedModes, IntentDialog(full:supporting:)) is iOS 26
  # API. Raise to 27.0 when Xcode 27 is installed (spike-results.md, SDK verification).
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Peggy:
    type: application
    platform: iOS
    sources:
      - path: Peggy
    info:
      path: Peggy/Info.plist
      properties:
        CFBundleDisplayName: Peggy
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrispatten.peggy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # App Intents metadata extraction happens automatically for app targets; kept explicit.
        ENABLE_APP_INTENTS_METADATA: YES
  PeggyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PeggyTests
    dependencies:
      - target: Peggy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrispatten.peggy.tests
schemes:
  Peggy:
    build:
      targets:
        Peggy: all
        PeggyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PeggyTests
